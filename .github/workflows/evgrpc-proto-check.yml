# GitHub Actions workflow: detect accidental edits to vendored .proto
# files that were not accompanied by an update of .upstream.sha256.
#
# Source of truth: XYPortal.EvGRPC/src/.../proto/evgrpc/.upstream.sha256
# Helper script:     scripts/proto-drift-check.sh
# Plan ref:          plan-evgrpc.md Step 1.3 + Step 4.5

name: evgrpc-proto-drift

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'XYPortal.EvGRPC/src/XYPortal.EvGRPC.gRPC/proto/**'
      - 'scripts/proto-drift-check.sh'
      - '.github/workflows/evgrpc-proto-check.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'XYPortal.EvGRPC/src/XYPortal.EvGRPC.gRPC/proto/**'
      - 'scripts/proto-drift-check.sh'
      - '.github/workflows/evgrpc-proto-check.yml'

# Allow manual re-runs from the Actions UI.
workflow_dispatch: {}

jobs:
  proto-drift-check:
    name: Verify vendored .proto hash matches manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run drift check
        # The script is cwd-agnostic — it resolves paths relative to
        # its own location. No additional setup needed.
        run: bash scripts/proto-drift-check.sh
